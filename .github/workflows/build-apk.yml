name: 📱 Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - debug
          - release
          - experimental
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      artifacts: write
      
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: 🔧 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 📝 Make Gradle executable
      run: chmod +x ./gradlew
      
    - name: 🔍 Validate Gradle Wrapper
      run: ./gradlew --version
      
    - name: 📦 Build Debug APK
      if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch'
      run: ./gradlew assembleDebug --stacktrace
      
    - name: 📦 Build Release APK (Unsigned)
      if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch'
      run: ./gradlew assembleRelease --stacktrace
      
    - name: 📦 Build Experimental APK
      if: github.event.inputs.build_type == 'experimental' || github.event.inputs.build_type == 'all'
      run: ./gradlew assembleExperimental --stacktrace
      
    - name: 📊 Generate Build Report
      if: always()
      run: |
        echo "## Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "app/build/outputs/apk/debug" ]; then
          echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "app/build/outputs/apk/release" ]; then
          echo "### Release APK" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d "app/build/outputs/apk/experimental" ]; then
          echo "### Experimental APK" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/experimental/*.apk 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
        fi
      
    - name: 📤 Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: ignore
        
    - name: 📤 Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        if-no-files-found: ignore
        
    - name: 📤 Upload Experimental APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: experimental-apk
        path: app/build/outputs/apk/experimental/app-experimental.apk
        retention-days: 30
        if-no-files-found: ignore
        
    - name: 📤 Upload Build Logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          app/build/reports/
          app/build/outputs/logs/
        retention-days: 7
        if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: 📝 Make Gradle executable
      run: chmod +x ./gradlew
      
    - name: 🧪 Run Unit Tests
      run: ./gradlew test --stacktrace
      
    - name: 📤 Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 30
        if-no-files-found: ignore
